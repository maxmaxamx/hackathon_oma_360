services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oma360:latest
    container_name: oma360
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/data/oma.db
    volumes:
      - oma360-data:/app/data
      - oma360-generated:/app/public/generated
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  oma360-data:
  oma360-generated:
